[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "viola-ai-assistant"
version = "0.1.0"
description = "A modular LangChain-powered AI personal assistant."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Viola Contributors" }]
keywords = ["ai", "assistant", "langchain", "agents", "cli"]
dependencies = [
  "ddgs>=9.0.0",
  "langchain[openai]>=1.0.0",
  "langchain-tavily>=0.2.0",
  "langgraph>=1.0.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.8.0",
]

[project.scripts]
viola = "viola.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/viola"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

